<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RWKV Channel Readout Trace</title>
<style>
  :root { color-scheme: dark; --ink: #e9e7df; --muted: #a6a49a; --paper: #151614; --panel: #1d1f1b; --card: #252721; --line: #3b3e36; --accent: #f0ae4e; --selected: #3e513d; --prompt: #29332d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  button, input { font: inherit; } button { color: inherit; cursor: pointer; }
  .site-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px max(20px, calc((100vw - 1680px) / 2)); border-bottom: 1px solid var(--line); background: #1a1c18; }
  h1, h2, p { margin: 0; } h1 { font: 700 22px/1.1 ui-serif, Georgia, serif; letter-spacing: .015em; } h2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  #file { max-width: 290px; color: var(--muted); }
  main { max-width: 1680px; margin: auto; padding: 22px; }
  .empty { min-height: 300px; display: grid; place-items: center; border: 1px dashed var(--line); color: var(--muted); text-align: center; }
  .workspace { display: grid; grid-template-columns: minmax(300px, .82fr) minmax(580px, 1.7fr); gap: 18px; align-items: start; }
  .pane { border: 1px solid var(--line); background: var(--panel); min-height: calc(100vh - 130px); }
  .pane-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: #21231e; }
  .trace-meta { color: var(--muted); font-size: 11px; text-align: right; }
  .chat { padding: 16px; }
  .bubble { padding: 13px 14px; border: 1px solid var(--line); margin-bottom: 16px; border-radius: 7px; }
  .prompt { background: var(--prompt); margin-right: 20px; } .answer { background: #22241f; margin-left: 8px; }
  .role { display: block; color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; }
  .prompt-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .completion { white-space: pre-wrap; overflow-wrap: anywhere; font: 16px/1.7 ui-serif, Georgia, serif; }
  .emitted { appearance: none; display: inline; padding: 1px 0; border: 0; border-radius: 2px; background: transparent; color: inherit; font: inherit; white-space: pre-wrap; }
  .emitted:hover { color: #ffd28e; background: #463821; } .emitted.selected { color: #fff3d4; background: var(--selected); box-shadow: 0 0 0 2px var(--accent); }
  .eog { color: var(--muted); font: 11px ui-monospace, monospace; margin-left: 5px; }
  .hint { color: var(--muted); font-size: 12px; }
  .inspector { position: sticky; top: 18px; }
  .selected-summary { padding: 15px 16px; border-bottom: 1px solid var(--line); background: #191b17; }
  .selected-summary strong { color: var(--accent); } .selected-summary p { margin-top: 5px; color: var(--muted); font-size: 12px; }
  .token-nav { display: flex; gap: 7px; margin-top: 12px; } .token-nav button { border: 1px solid var(--line); background: var(--card); padding: 5px 9px; border-radius: 3px; } .token-nav button:hover { border-color: var(--accent); }
  #layers { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 9px; padding: 14px; max-height: calc(100vh - 285px); overflow: auto; }
  .layer { border: 1px solid var(--line); background: #181a17; padding: 10px; min-height: 145px; }
  .layer header { display: flex; justify-content: space-between; padding-bottom: 8px; color: var(--muted); font-size: 11px; }
  .layer ol { margin: 0; padding-left: 23px; } .layer li { min-height: 22px; padding: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: pre; }
  .score { float: right; color: var(--muted); font-size: 10px; }
  .error { color: #ff9b87; white-space: pre-wrap; }
  @media (max-width: 980px) { main { padding: 12px; } .workspace { grid-template-columns: 1fr; } .pane { min-height: auto; } .inspector { position: static; } #layers { max-height: none; } }
  @media (max-width: 600px) { .site-header { align-items: flex-start; flex-direction: column; } .workspace { gap: 12px; } #layers { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="site-header">
  <h1>RWKV Activation Trace</h1>
  <input id="file" type="file" accept="application/json,.json" aria-label="Load a JSON trace">
</header>
  <main id="app"><section class="empty">Generate an unembedding or perturbation trace with `--json trace.json`, then select or drop its JSON file here.</section></main>
<script>
(() => {
  const app = document.querySelector('#app');
  const file = document.querySelector('#file');
  let trace, runIndex = 0, stepIndex = 0, layerScrollTop = 0;

  const sourceLayer = source => Number((source.match(/\.layer\.(\d+)\./) || [])[1] || 0);
  const sourceKind = source => (source.match(/\.layer\.\d+\.(.+)$/) || [])[1] || source;
  const sortSources = sources => sources.slice().sort((a, b) => sourceLayer(a) - sourceLayer(b));
  const channelSources = () => sortSources(trace.sources.filter(source => source.endsWith('.channel.out')));
  const visibleSources = () => channelSources().length ? channelSources() : sortSources(trace.sources);
   const sourceReadout = (step, source) => step.readouts.find(readout => readout.source === source);
   const displayPiece = value => value === '' ? '[EOG]' : value.replace(/\n/g, '\\n').replace(/\t/g, '\\t');
  const isPerturbation = () => trace.trace_kind === 'rwkv_perturbation';
  const isTimeLens = () => trace.trace_kind === 'rwkv_time_lens';
  const isRawProjection = () => trace.trace_kind === 'rwkv_raw_projection';

  function setStep(index) {
    const steps = trace.runs[runIndex].steps;
    layerScrollTop = document.querySelector('#layers')?.scrollTop ?? layerScrollTop;
    stepIndex = Math.max(0, Math.min(index, steps.length - 1));
    render();
  }

  function makeHeader(title, meta) {
    const header = document.createElement('header'); header.className = 'pane-header';
    const heading = document.createElement('h2'); heading.textContent = title;
    const details = document.createElement('span'); details.className = 'trace-meta'; details.textContent = meta;
    header.append(heading, details); return header;
  }

  function render() {
    const run = trace.runs[runIndex];
    const step = run.steps[stepIndex];
    const sources = visibleSources();
    const workspace = document.createElement('div'); workspace.className = 'workspace';

    const transcript = document.createElement('section'); transcript.className = 'pane';
    transcript.append(makeHeader(isPerturbation() ? 'Perturbation' : 'Generation', `${run.steps.length} ${isPerturbation() ? 'measurement' : 'tokens'} | ${run.stopped}`));
    const chat = document.createElement('div'); chat.className = 'chat';
    const prompt = document.createElement('article'); prompt.className = 'bubble prompt'; prompt.innerHTML = '<span class="role">Prompt</span><div class="prompt-text"></div>';
    prompt.querySelector('.prompt-text').textContent = run.prompt; chat.append(prompt);
    const answer = document.createElement('article'); answer.className = 'bubble answer'; answer.innerHTML = isPerturbation() ? '<span class="role">Clean continuation</span><div class="completion"></div><p class="hint">Inspect the signed final-logit derivatives for the selected raw source.</p>' : '<span class="role">Generated completion</span><div class="completion"></div><p class="hint">Click an emitted token to inspect the prior carrier token and all layer readouts.</p>';
    const completion = answer.querySelector('.completion');
    run.steps.forEach((item, index) => {
      const token = document.createElement('button'); token.className = `emitted${index === stepIndex ? ' selected' : ''}`;
      token.textContent = item.next.piece || '[EOG]'; token.title = `step ${index}: ${displayPiece(item.input.piece)} -> ${displayPiece(item.next.piece)}`;
      token.onclick = () => setStep(index); completion.append(token);
    });
    if (run.stopped === 'eog') { const eog = document.createElement('span'); eog.className = 'eog'; eog.textContent = '[EOG]'; completion.append(eog); }
    chat.append(answer); transcript.append(chat); workspace.append(transcript);

    const inspector = document.createElement('section'); inspector.className = 'pane inspector';
    inspector.append(makeHeader(isPerturbation() ? 'Raw-Source Token Derivatives' : isTimeLens() ? 'All-Layer Time-Mix Lens' : isRawProjection() ? 'All Raw Vector Projections' : `All-Layer ${sourceKind(sources[0])}`, `${sources.length} ${isPerturbation() ? 'signed readouts' : 'sources'} | top ${trace.top_k}`));
    const selected = document.createElement('div'); selected.className = 'selected-summary';
    const line = document.createElement('strong'); line.textContent = `Step ${step.index}: ${displayPiece(step.input.piece)} -> ${displayPiece(step.next.piece)}`;
    const tracked = trace.tracked_token ? ` Card headers show cosine to the first measured vector and # rank for ${displayPiece(trace.tracked_token.piece)}.` : ' Card headers show cosine to the first measured vector and # rank for that step\'s emitted next token.';
    const note = document.createElement('p'); note.textContent = isPerturbation() ? 'Scores are signed central derivatives of final logits with respect to the native source perturbation. Positive and negative cards are sorted independently.' : isTimeLens() ? `Each card perturbs ${sourceKind(sources[0])}, runs its native downstream time-mix closure and channel mix, then applies an output-head lens. These are local diagnostic readouts, not causal final logits.` : isRawProjection() ? `Each raw vector is independently passed through the native output normalization and output matrix. This is an intrinsic alignment screen, not a causal final-logit measurement.${tracked}` : `Readouts are from the carrier activation that produced the selected emitted token. Final-residual round-trip error: ${step.final_round_trip_error.toExponential(3)}.`;
    const nav = document.createElement('div'); nav.className = 'token-nav';
    [['Previous', stepIndex - 1], ['Next', stepIndex + 1]].forEach(([label, target]) => { const button = document.createElement('button'); button.textContent = label; button.disabled = target < 0 || target >= run.steps.length; button.onclick = () => setStep(target); nav.append(button); });
    selected.append(line, note, nav); inspector.append(selected);
    const grid = document.createElement('div'); grid.id = 'layers';
    sources.forEach(source => {
      const readout = sourceReadout(step, source); const card = document.createElement('article'); card.className = 'layer';
      const label = document.createElement('header'); label.textContent = `Layer ${sourceLayer(source)}`; const kind = document.createElement('span');
      const cosine = Number.isFinite(readout?.baseline_cosine) ? ` cos ${readout.baseline_cosine.toFixed(3)}` : '';
      const target = Number.isInteger(readout?.target_rank) ? ` #${readout.target_rank}` : '';
      const random = Number.isInteger(readout?.random_target_rank) ? ` rnd#${readout.random_target_rank}` : '';
      kind.textContent = `${sourceKind(source)}${cosine}${target}${random}`; label.append(kind); card.append(label);
      const list = document.createElement('ol');
      (readout?.top_tokens || []).forEach(token => { const item = document.createElement('li'); const score = document.createElement('span'); score.className = 'score'; score.textContent = token.logit.toFixed(2); item.append(document.createTextNode(displayPiece(token.piece)), score); list.append(item); });
      if (!readout) list.textContent = 'No readout in trace.'; card.append(list); grid.append(card);
    });
    grid.onscroll = () => { layerScrollTop = grid.scrollTop; };
    inspector.append(grid); workspace.append(inspector); app.replaceChildren(workspace);
    requestAnimationFrame(() => { grid.scrollTop = layerScrollTop; });
  }

  function showError(message) { const panel = document.createElement('section'); panel.className = 'empty error'; panel.textContent = message; app.replaceChildren(panel); }
  function load(text) {
    try {
      const parsed = JSON.parse(text);
      if (parsed.schema_version !== 1 || !Array.isArray(parsed.runs) || !parsed.runs.length || !parsed.runs[0].steps.length) throw new Error('Expected a non-empty schema-version 1 unembed generation trace.');
      trace = parsed; runIndex = 0; stepIndex = 0; layerScrollTop = 0; render();
    } catch (error) { showError(error.message); }
  }
  file.onchange = event => event.target.files[0]?.text().then(load);
  document.addEventListener('dragover', event => event.preventDefault());
  document.addEventListener('drop', event => { event.preventDefault(); const dropped = event.dataTransfer.files[0]; if (dropped) dropped.text().then(load); });
  const traceUrl = new URLSearchParams(location.search).get('trace');
  if (traceUrl) fetch(traceUrl).then(response => response.ok ? response.text() : Promise.reject(new Error(`Could not fetch ${traceUrl}`))).then(load).catch(error => showError(error.message));
})();
</script>
</body>
</html>
